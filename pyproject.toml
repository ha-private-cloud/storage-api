[project]
name = "storage-api"
version = "0.1.0"
description = "ClusterKeep storage: per-user encrypted files and folders, internal to the cluster"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120.0",
    "gunicorn>=26.0.0",
    "uvicorn[standard]>=0.38.0",
    "uvicorn-worker>=0.4.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.8.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.0",
    "redis>=6.0.0",
    "httpx>=0.28.0",
    "pillow>=12.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "aiosqlite>=0.21.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
